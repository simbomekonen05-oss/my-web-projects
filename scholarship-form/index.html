<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scholarship Registration Form</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f9;font-family:Arial,sans-serif;color:#1f2937;padding:28px 14px}
main{max-width:760px;margin:auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 8px 28px #17255415}
h1{margin-top:0;color:#183b66}p{color:#526174;line-height:1.5}
form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}label,legend{font-weight:600;font-size:.95rem}
input,select,textarea{font:inherit;padding:11px;border:1px solid #cbd5e1;border-radius:8px;width:100%}
fieldset{border:1px solid #cbd5e1;border-radius:8px;padding:12px;display:flex;flex-wrap:wrap;gap:12px}
fieldset label{font-weight:400;display:flex;align-items:center;gap:6px}fieldset input{width:auto}
button{background:#1d4ed8;color:white;border:0;padding:12px 18px;border-radius:8px;font-weight:700;cursor:pointer}
button:hover{background:#1e40af}.note{font-size:.85rem}
#message{margin-top:14px;color:#166534;font-weight:600}
@media(max-width:560px){form{grid-template-columns:1fr}.full{grid-column:auto}main{padding:20px}}
</style>
</head>
<body><main>
<h1>Scholarship Registration Form</h1>
<p>Practice project recreated from the supplied screenshot. This demo does not send or store your information.</p>
<form id="scholarshipForm">
<div class="field"><label for="first">First name</label><input id="first" name="first" required></div>
<div class="field"><label for="last">Last name</label><input id="last" name="last" required></div>
<div class="field"><label for="age">Age</label><input id="age" name="age" type="number" min="1" max="120" required></div>
<div class="field"><label for="address">Address</label><input id="address" name="address" required></div>
<div class="field"><label for="date">Date</label><input id="date" name="date" type="date"></div>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
<div class="field"><label for="password">Password (demo only)</label><input id="password" name="password" type="password" autocomplete="new-password"></div>
<div class="field"><label for="birthday">Birthday</label><input id="birthday" name="birthday" placeholder="DD/MM/YYYY"></div>
<div class="field full"><label for="about">About you</label><textarea id="about" name="about" rows="3"></textarea></div>
<div class="field full"><span>Sex</span><fieldset><label><input type="radio" name="sex" value="Female"> Female</label><label><input type="radio" name="sex" value="Male"> Male</label><label><input type="radio" name="sex" value="Prefer not to say"> Prefer not to say</label></fieldset></div>
<div class="field full"><span>Hobbies</span><fieldset>
<label><input type="checkbox" name="hobbies" value="Football"> Football</label>
<label><input type="checkbox" name="hobbies" value="Volleyball"> Volleyball</label>
<label><input type="checkbox" name="hobbies" value="TikTok"> TikTok</label>
<label><input type="checkbox" name="hobbies" value="Games"> Games</label>
<label><input type="checkbox" name="hobbies" value="Pool"> Pool</label>
</fieldset></div>
<div class="field"><label for="study">Scholarship study level</label><select id="study" name="study" required><option value="">Choose a level</option><option>High school</option><option>Preparatory</option><option>Degree</option><option>Master's</option><option>PhD</option></select></div>
<div class="field"><label for="color">Favorite color</label><input id="color" name="color" type="color" value="#1d4ed8"></div>
<div class="field full"><button type="submit">Submit demo form</button><div id="message" role="status"></div><p class="note">Privacy note: do not enter real passwords or sensitive personal data. This is a front-end demonstration only.</p></div>
</form>
</main><script>
document.getElementById('scholarshipForm').addEventListener('submit',function(e){e.preventDefault();document.getElementById('message').textContent='Demo submitted successfully. No data was sent or saved.';});
</script></body></html>
